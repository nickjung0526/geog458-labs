<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 — Pittsburgh trees</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
      const tokenPart1 = 'pk.eyJ1Ijoibmp1bmcwMyIsImEiOiJjbXY1az';
      const tokenPart2 = 'RncjAwMXMyMnlxM3JqZWdoMW9nIn0.CZDz0PrR6ITIlbibWP9PzQ';
    // Splitting the tokens into two strings to bypass the GitHub Push error
      mapboxgl.accessToken = tokenPart1 + tokenPart2;
    const map = new mapboxgl.Map({
      container: 'map',
      // Customized Basemap
      style: 'mapbox://styles/mapbox/light-v11',
      projection: 'globe',
      center: [-79.999732, 40.4374],
      zoom: 14,
      maxZoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
      map.setFog({});
      
      // 1.3 Add a tree source
      map.addSource('trees', {
        type: 'geojson',
        data: 'data/trees.geojson'
      });
      
      // 1.4 Add the customized heatmap layer
      map.addLayer({
        'id': "trees-heat",
        'type': "heatmap",
        'source': "trees",
        'maxzoom': 15,
        'paint': {
          'heatmap-weight': {
            'property': "dbh",
            'type': "exponential",
            'stops': [[1, 0], [62, 1]]
          },
          // Customized Intensity
          'heatmap-intensity': {
            'stops': [[11, 1.5], [15, 4]]
          },
          // Customized Color Ramp (Yellow/Orange/Red)
          'heatmap-color': [
            "interpolate", ["linear"], ["heatmap-density"],
            0, "rgba(255,255,178,0)",
            0.2, "rgb(255,237,160)",
            0.4, "rgb(254,178,76)",
            0.6, "rgb(240,59,32)",
            0.8, "rgb(189,0,38)"
          ],
          // Customized Radius
          'heatmap-radius': {
            'stops': [[11, 25], [15, 30]]
          },
          'heatmap-opacity': {
            'default': 1,
            'stops': [[14, 1], [15, 0]]
          }
        }
      });
      
      // 1.5 Add individual tree circles
      map.addLayer({
        'id': "trees-point",
        'type': "circle",
        'source': "trees",
        'minzoom': 14,
        'paint': {
          'circle-radius': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [{ 'zoom': 15, 'value': 1 }, 5],
              [{ 'zoom': 15, 'value': 62 }, 10],
              [{ 'zoom': 22, 'value': 1 }, 20],
              [{ 'zoom': 22, 'value': 62 }, 50]
            ]
          },
          'circle-color': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [0, "rgba(236,222,239,0)"],
              [10, "rgb(236,222,239)"],
              [20, "rgb(208,209,230)"],
              [30, "rgb(166,189,219)"],
              [40, "rgb(103,169,207)"],
              [50, "rgb(28,144,153)"],
              [60, "rgb(1,108,89)"]
            ]
          },
          'circle-stroke-color': "white",
          'circle-stroke-width': 1,
          'circle-opacity': {
            'stops': [[14, 0], [15, 1]]
          }
        }
      });
      
      // 1.6 Add the DBH popup
      map.on('click', 'trees-point', (event) => {
        new mapboxgl.Popup()
          .setLngLat(event.features[0].geometry.coordinates)
          .setHTML(`<strong>DBH:</strong> ${event.features[0].properties.dbh}`)
          .addTo(map);
      });
    });
  </script>
</body>
</html>
