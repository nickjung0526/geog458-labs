<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      mapboxgl.accessToken = 'pk.eyJ1Ijoibmp1bmcwMyIsImEiOiJjbXY1azRncjAwMXMyMnlxM3JqZWdoMW9nIn0.CZDz0PrR6ITIlbibWP9PzQ';
      const mymap = new mapboxgl.Map({
             container: 'map',
             style: 'mapbox://styles/mapbox/outdoors-v12://styles/mapbox/light-v11',
            //  projection: 'globe', //Display the map as a globe since satellite-v9 defaults to Mercator
             
             //changed centering since its [long, lat] and centered it to Red Square, zoom 18 allowed it to be close enough to see building names
             center: [-122.30944, 47.65583],
             zoom:18
          });
          // adds UI control for zoom and fullscreen capabilities
mymap.addControl(new mapboxgl.FullscreenControl());
mymap.addControl(new mapboxgl.NavigationControl())
</script>
</body>
